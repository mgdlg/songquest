# Builds Song Quest as a static site and publishes it to GitHub Pages.
#
# No secrets are involved. Every bird's dossier is pre-generated locally by
# scripts/generate-dossiers.ts and committed under public/data/, so this
# workflow never touches the Xeno-canto API or its key — it only compiles
# HTML, JS and JSON and uploads them.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # A project site is served under /<repo>/, so every route and asset
          # needs that prefix. next.config.mjs reads it; locally it is unset.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
